name: majority_vote_compact
description: Three independent task-specific solver proposals and one synthesis agent
backend: smolagents
agents:
  worker1:
    id: worker1
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Propose one efficient TabuCol-style solver with incremental conflict counts
      and bounded per-graph search. Use only imports and public assets allowed by
      the current official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.65
    device: null
  worker2:
    id: worker2
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Propose a distinct restart or perturbation policy; compare per-graph conflicts
      on public instances. Use only imports and public assets allowed by the current
      official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker3:
    id: worker3
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Audit color range, return lengths, deadline guards, and fallbacks on the
      largest public graphs. Use only imports and public assets allowed by the current
      official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.35
    device: null
  aggregator:
    id: aggregator
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: "Synthesize one complete solve(data) returning all requested colorings,\
      \ integers in [0,target_k). For each graph, evaluate the three worker proposals\
      \ by their conflict counts on the public instances. Select the proposal with\
      \ the fewest conflicts as the base solution, then apply targeted local improvements:\
      \ identify vertices with conflicts and attempt to recolor them with available\
      \ colors that minimize new conflicts. Use iterative local search (e.g., swap\
      \ conflicting colors, re-color small conflicting subgraphs) to reduce total\
      \ conflicts. Self-check within 45 seconds per graph and return the coloring\
      \ with the lowest conflicts achieved. Use only imports and public assets allowed\
      \ by the current official task."
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.2
    device: null
topology:
  reports_to:
    worker1:
    - aggregator
    worker2:
    - aggregator
    worker3:
    - aggregator
execution:
  parallel_workers: true
  timeout: 600
  max_retries: 0