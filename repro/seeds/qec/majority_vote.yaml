name: majority_vote_compact
description: Three independent task-specific solver proposals and one synthesis agent
backend: smolagents
agents:
  worker1:
    id: worker1
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Implement a minimum-weight perfect matching decoder for color codes. Return a complete decode(setting, dets) function that returns boolean [n_shots, n_observables] array. Use only imports and public assets allowed by the current official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.65
    device: null
  worker2:
    id: worker2
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Implement a union-find decoder for color codes. Return a complete decode(setting, dets) function that returns boolean [n_shots, n_observables] array. Use only imports and public assets allowed by the current official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.7
    device: null
  worker3:
    id: worker3
    role: worker
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Implement a tensor-network or matching-based decoder for color codes. Return a complete decode(setting, dets) function that returns boolean [n_shots, n_observables] array. Use only imports and public assets allowed by the current official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.35
    device: null
  aggregator:
    id: aggregator
    role: aggregator
    agent_type: CodeAgent
    model_id: openai:deepseek-v4-flash-s2
    prompt: Review the three worker decoder implementations. Select the best one or combine approaches to produce one complete decode(setting,dets) returning a boolean [n_shots,n_observables] array for every setting; check all four public settings (color_d5, color_d5_Z, color_d7, color_d9). Use only imports and public assets allowed by the current official task.
    tools:
    - research_read_context
    - research_read_public
    - research_read_history
    - research_write_candidate
    - research_preflight
    - research_read_feedback
    - research_read_trace
    - research_probe_candidate
    max_tokens: 4096
    temperature: 0.2
    device: null
topology:
  reports_to:
    worker1:
    - aggregator
    worker2:
    - aggregator
    worker3:
    - aggregator
execution:
  parallel_workers: true
  timeout: 600
  max_retries: 0